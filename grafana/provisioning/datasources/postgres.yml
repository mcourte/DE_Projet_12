apiVersion: 1

datasources:
  - name: PostgreSQL sportdata
    uid: sportdata-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: sportdata
    isDefault: true
    jsonData:
      database: sportdata
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
