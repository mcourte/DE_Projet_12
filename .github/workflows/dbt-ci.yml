# AXE D'AMÉLIORATION (hors périmètre du POC) : valide chaque push en
# exécutant `dbt build` sur DuckDB — aucun service externe requis (pas de
# Postgres/NATS à monter en CI), donc rapide et sans dépendance réseau.
#
# TODO avant que ce workflow soit vraiment utilisable :
# 1. Fournir un petit jeu de données Parquet de test dans data/bronze/
#    (quelques lignes anonymisées, committées dans un dossier tests/fixtures/)
#    puisque data/bronze/ est ignoré par .gitignore pour les vraies données RH.
# 2. Adapter dbt/profiles.yml.example -> profiles.yml pour pointer sur un
#    fichier DuckDB temporaire (ex. via une variable d'environnement CI).

name: dbt-ci

on:
  push:
    paths:
      - "dbt/**"
  pull_request:
    paths:
      - "dbt/**"

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances dbt
        run: pip install dbt-core dbt-duckdb

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build (sur le jeu de données de test)
        working-directory: dbt
        run: dbt build --target ci
        # TODO : ajouter un target "ci" dans profiles.yml pointant vers
        # un fichier DuckDB jetable alimenté par les fixtures du point 1.
