name: dbt-ci

on:
  push:
    paths:
      - "dbt/**"
      - "tests/fixtures/**"
  pull_request:
    paths:
      - "dbt/**"
      - "tests/fixtures/**"

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances dbt
        run: pip install dbt-core dbt-duckdb

      - name: Préparer les données de test et le profil dbt
        run: |
          mkdir -p data
          cp -r tests/fixtures/bronze data/bronze
          cp dbt/profiles.yml.example dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build (sur le jeu de données de test)
        working-directory: dbt
        run: dbt build --target ci
