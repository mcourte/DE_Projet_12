services:
  postgres:
    image: postgres:16-alpine
    container_name: sportdata-postgres
    environment:
      POSTGRES_DB: sportdata
      POSTGRES_USER: sportdata
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2-alpine
    container_name: sportdata-nats
    ports:
      - "4222:4222"
      - "8222:8222"

  grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: sportdata-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: changeme
      POSTGRES_PASSWORD: changeme
    depends_on:
      - postgres
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  grafana-data:
